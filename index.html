<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Sihan MooShow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1 id="pageTitle">To Watch or Not to Watch 👀</h1>
    <div class="toolbar">
        <div class="toolbar-row">
            <div class="field title-field">
                <label>Title</label>
                <div class="title-search">
                    <input id="title" type="text" placeholder="Search a movie, anime or series" autocomplete="off">
                    <div id="searchResults" class="search-results"></div>
                </div>
            </div>
            <div class="field genre-field">
                <label>Genre</label>
                <div class="genre-select-wrapper">
                    <button type="button" id="genreBtn" class="genre-select-btn">
                        <span id="genreBtnLabel">Select Genres</span>
                        <svg class="chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                    <div id="genrePanel" class="genre-panel">
                        <div class="genre-option" data-genre="Action">Action</div>
                        <div class="genre-option" data-genre="Adventure">Adventure</div>
                        <div class="genre-option" data-genre="Animation">Animation</div>
                        <div class="genre-option" data-genre="Comedy">Comedy</div>
                        <div class="genre-option" data-genre="Crime">Crime</div>
                        <div class="genre-option" data-genre="Drama">Drama</div>
                        <div class="genre-option" data-genre="Fantasy">Fantasy</div>
                        <div class="genre-option" data-genre="Horror">Horror</div>
                        <div class="genre-option" data-genre="Mystery">Mystery</div>
                        <div class="genre-option" data-genre="Romance">Romance</div>
                        <div class="genre-option" data-genre="Sci-Fi">Sci-Fi</div>
                        <div class="genre-option" data-genre="Thriller">Thriller</div>
                    </div>
                </div>
            </div>
            <div class="field">
                <label>Type</label>
                <select id="type">
                    <option>Movie</option>
                    <option>Series</option>
                    <option>Anime</option>
                </select>
            </div>
            <div class="field progress-field">
                <label>Season</label>
                <input id="season" type="number" min="1" step="1" value="1" inputmode="numeric">
            </div>
            <div class="field progress-field">
                <label>Episode</label>
                <input id="episode" type="number" min="1" step="1" value="1" inputmode="numeric">
            </div>
            <button id="addBtn">+ Add</button>
            <button id="lockBtn" class="secondary-btn" type="button">Lock</button>
        </div>
        <div class="search-row">
            <input id="search" type="text" placeholder="🔍 Search titles...">
            <div class="filter-wrapper">
                <button id="filterBtn" class="filter-btn" type="button" title="Filter & Sort">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="4 4 20 4 14 12.5 14 19 10 21 10 12.5 4 4"></polygon>
                    </svg>
                    <span id="filterDot" class="filter-dot"></span>
                </button>
                <div id="filterPanel" class="filter-panel">
                    <div class="field">
                        <label>Genre</label>
                        <select id="filterGenre">
                            <option value="">All Genres</option>
                            <option>Action</option>
                            <option>Adventure</option>
                            <option>Animation</option>
                            <option>Comedy</option>
                            <option>Crime</option>
                            <option>Drama</option>
                            <option>Fantasy</option>
                            <option>Horror</option>
                            <option>Mystery</option>
                            <option>Romance</option>
                            <option>Sci-Fi</option>
                            <option>Thriller</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Sort</label>
                        <select id="sortBy">
                            <option value="created_at">Recently Added</option>
                            <option value="title">Title (A–Z)</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="category-tabs" id="categoryTabs">
                <button type="button" class="category-tab active" data-type="">All</button>
                <button type="button" class="category-tab" data-type="Movie">Movies</button>
                <button type="button" class="category-tab" data-type="Show">Shows</button>
            </div>
            <button id="historyBtn" class="history-btn" type="button">We Binged →</button>
        </div>
    </div>
    <div id="watchlist" class="grid"></div>
</div>

<div id="progressModal" class="modal">
    <div class="modal-content">
        <h2>🎬 Update Progress</h2>
        <p>Where are we now?</p>
        <div class="modal-row">
            <div class="field">
                <label>Season</label>
                <input id="modalSeason" type="number" min="1">
            </div>
            <div class="field">
                <label>Episode</label>
                <input id="modalEpisode" type="number" min="1">
            </div>
        </div>
        <div class="modal-buttons">
            <button id="cancelModal" class="secondary-btn">Cancel</button>
            <button id="saveModal">Save</button>
        </div>
    </div>
</div>

<div id="deleteModal" class="modal">
    <div class="modal-content">
        <h2>🗑 Delete Item</h2>
        <p id="deleteText">Are you sure?</p>
        <div class="modal-buttons">
            <button id="deleteNo" class="secondary-btn">No</button>
            <button id="deleteYes">Yes</button>
        </div>
    </div>
</div>

<div id="detailsModal" class="modal">
    <div class="modal-content details-content">
        <button class="icon-btn" id="closeDetails">✕</button>
        <img id="detailsBackdrop" class="details-backdrop" src="" alt="">
        <div class="details-body">
            <h2 id="detailsTitle"></h2>
            <div class="badges" id="detailsBadges"></div>
            <p id="detailsMeta" class="details-meta"></p>
            <p id="detailsOverview"></p>
        </div>
    </div>
</div>

<div id="loginModal" class="modal">
    <div class="modal-content">
        <h2>Edit mode</h2>
        <p>Enter the passcode</p>
        <div class="field">
            <input id="loginPassword" type="password" inputmode="numeric" autocomplete="off" placeholder="Passcode">
        </div>
        <div id="loginError" class="login-error"></div>
        <div class="modal-buttons">
            <button id="loginCancel" class="secondary-btn" type="button">Cancel</button>
            <button id="loginSubmit" type="button">Unlock</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="script.js"></script>
</body>
</html>
